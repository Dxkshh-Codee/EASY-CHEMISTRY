<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>EASY-CHEMISTRY</title>

    <!-- Import Map: resolves bare 'three' imports -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <link rel="stylesheet" href="style.css" />

    <!-- MediaPipe scripts (classic) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js">
    </script>
</head>
<body>

    <div id="loading">
        <span class="spinner"></span> Loading 115+ Molecules...
    </div>

    <div id="info-panel">
        <h1>🧪 EASY-CHEMISTRY</h1>
        <div class="sub">115+ Organic Molecules — <span>Search</span> &amp; <span>Learn</span>!</div>
    </div>

    <div id="status-msg">🤚 Show open palm to reset view</div>

    <div id="search-container">
        <input type="text" id="searchBox" placeholder="🔍 Search molecule (e.g., Butane, Phenol)..." autocomplete="off" />
        <div id="category-container">
            <button class="cat-btn active" data-cat="all">🌟 All</button>
            <button class="cat-btn" data-cat="alkane">Alkanes</button>
            <button class="cat-btn" data-cat="alkene">Alkenes</button>
            <button class="cat-btn" data-cat="alkyne">Alkynes</button>
            <button class="cat-btn" data-cat="alcohol">Alcohols</button>
            <button class="cat-btn" data-cat="aldehyde">Aldehydes</button>
            <button class="cat-btn" data-cat="ketone">Ketones</button>
            <button class="cat-btn" data-cat="acid">Acids</button>
            <button class="cat-btn" data-cat="ester">Esters</button>
            <button class="cat-btn" data-cat="amine">Amines</button>
            <button class="cat-btn" data-cat="halide">Halides</button>
            <button class="cat-btn" data-cat="cyclo">Cycloalkanes</button>
            <button class="cat-btn" data-cat="aromatic">Aromatics</button>
        </div>
    </div>

    <button class="auto-rotate-btn" id="autoRotateBtn">🔄 Auto-Rotate</button>

    <!-- Camera preview window -->
    <div id="camera-preview">
        <div id="camera-header">
            <span>📷 Hand Tracking</span>
            <button id="camera-toggle" title="Toggle camera view">−</button>
        </div>
        <div id="camera-video-wrapper">
            <!-- video element will be inserted here by JS -->
        </div>
        <div id="camera-status">⏳ Starting camera...</div>
    </div>

    <!-- Main application script -->
    <script type="module" src="main.js"></script>
</body>
</html>
